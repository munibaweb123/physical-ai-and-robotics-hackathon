}
```

## Content Adaptation API

### 5. Get Personalized Chapter Content (GET /api/chapters/{chapterId}/content/personalized)

**Purpose**: Endpoint to retrieve chapter content with personalization applied

**Request**:
```
GET /api/chapters/{chapterId}/content/personalized
Authorization: Bearer {token}
```

**Path Parameters**:
- `chapterId`: Unique identifier for the chapter

**Query Parameters**:
- `complexityOverride`: Optional override for complexity level (beginner, intermediate, advanced, expert)
- `focusAreaOverride`: Optional override for focus area

**Response (200 OK)**:
```json
{
  "chapterId": "ch-001-introduction",
  "title": "Introduction to Physical AI",
  "content": "# Personalized Introduction to Physical AI\n\nThis section introduces the key concepts...",
  "adaptationsApplied": [
    {
      "type": "difficulty-adjustment",
      "appliedRule": "simplified-explanation",
      "originalText": "The complex mathematical formulation of the control algorithms...",
      "adaptedText": "The basic idea behind control algorithms is..."
    },
    {
      "type": "example-substitution",
      "appliedRule": "practical-example",
      "originalText": "Consider the theoretical model where X = Y...",
      "adaptedText": "Consider a robot arm that needs to pick up objects..."
    }
  ],
  "relevanceScore": 0.85,
  "metadata": {
    "estimatedReadingTime": 1200,
    "difficultyLevel": "intermediate",
    "focusAreas": ["practical-applications", "robotics"]
  }
}
```

**Response (401 Unauthorized)**:
```json
{
  "success": false,
  "error": "Authentication required"
}
```

**Response (404 Not Found)**:
```json
{
  "success": false,
  "error": "Chapter not found"
}
```

## Personalization History API

### 6. Get Personalization History (GET /api/user/personalization/history)

**Purpose**: Endpoint to retrieve user's personalization history and engagement metrics

**Request**:
```
GET /api/user/personalization/history?limit=10&page=1
Authorization: Bearer {token}
```

**Query Parameters**:
- `limit`: Number of records to return (default: 10, max: 50)
- `page`: Page number for pagination (default: 1)
- `chapterId`: Optional filter for specific chapter
- `startDate`: Optional filter for start date (ISO 8601 format)
- `endDate`: Optional filter for end date (ISO 8601 format)

**Response (200 OK)**:
```json
{
  "history": [
    {
      "id": "hist-001",
      "chapterId": "ch-001-introduction",
      "chapterTitle": "Introduction to Physical AI",
      "personalizationActive": true,
      "engagementMetrics": {
        "timeSpent": 1200,
        "scrollDepth": 0.85,
        "completions": 1,
        "helpRequests": 2
      },
      "adaptationsCount": 5,
      "relevanceScore": 0.85,
      "personalizedAt": "2025-12-20T09:30:00Z",
      "viewedAt": "2025-12-20T10:00:00Z"
    }
  ],
  "total": 25,
  "page": 1,
  "limit": 10
}
```

**Response (401 Unauthorized)**:
```json
{
  "success": false,
  "error": "Authentication required"
}
```