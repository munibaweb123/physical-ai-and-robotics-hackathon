# API Contracts: Chapter Content Personalization

## Chapter Personalization Toggle API

### 1. Toggle Chapter Personalization (POST /api/chapters/{chapterId}/personalize)

**Purpose**: Endpoint to activate or deactivate personalization for a specific chapter

**Request**:
```
POST /api/chapters/{chapterId}/personalize
Content-Type: application/json
Authorization: Bearer {token}
```

**Path Parameters**:
- `chapterId`: Unique identifier for the chapter

**Request Body**:
```json
{
  "activate": true,
  "preferences": {
    "complexityLevel": "intermediate",
    "preferredExamples": ["practical", "case-studies"],
    "focusAreas": ["software", "practice"]
  }
}
```

**Response (200 OK)**:
```json
{
  "success": true,
  "chapterId": "ch-001-introduction",
  "personalizationActive": true,
  "adaptationsApplied": [
    "simplified-explanation",
    "practical-examples",
    "intermediate-complexity"
  ],
  "message": "Personalization activated for chapter"
}
```

**Response (400 Bad Request)**:
```json
{
  "success": false,
  "error": "Invalid input data",
  "details": {
    "chapterId": "Chapter ID is required and must be valid",
    "activate": "Activate flag must be boolean"
  }
}
```

**Response (401 Unauthorized)**:
```json
{
  "success": false,
  "error": "Authentication required"
}
```

**Response (404 Not Found)**:
```json
{
  "success": false,
  "error": "Chapter not found"
}
```

### 2. Get Chapter Personalization State (GET /api/chapters/{chapterId}/personalize)

**Purpose**: Endpoint to retrieve the current personalization state for a chapter

**Request**:
```
GET /api/chapters/{chapterId}/personalize
Authorization: Bearer {token}
```

**Path Parameters**:
- `chapterId`: Unique identifier for the chapter

**Response (200 OK)**:
```json
{
  "chapterId": "ch-001-introduction",
  "personalizationActive": true,
  "currentSettings": {
    "complexityLevel": "intermediate",
    "preferredExamples": ["practical", "case-studies"],
    "focusAreas": ["software", "practice"]
  },
  "adaptationsApplied": [
    "simplified-explanation",
    "practical-examples"
  ],
  "engagementMetrics": {
    "timeSpent": 1200,
    "scrollDepth": 0.85,
    "interactionCount": 3
  }
}
```

**Response (401 Unauthorized)**:
```json
{
  "success": false,
  "error": "Authentication required"
}
```

**Response (404 Not Found)**:
```json
{
  "success": false,
  "error": "Chapter not found or no personalization state"
}
```

## Personalization Preferences API

### 3. Update Personalization Preferences (PUT /api/user/personalization/preferences)

**Purpose**: Endpoint to update user's global personalization preferences

**Request**:
```
PUT /api/user/personalization/preferences
Content-Type: application/json
Authorization: Bearer {token}
```

**Request Body**:
```json
{
  "complexityLevel": "intermediate",
  "preferredExamples": ["practical", "case-studies"],
  "focusAreas": ["software", "practice"],
  "enabledFeatures": {
    "adaptiveDifficulty": true,
    "customExamples": true,
    "terminologyAdjustment": false
  }
}
```

**Response (200 OK)**:
```json
{
  "success": true,
  "message": "Personalization preferences updated successfully",
  "preferences": {
    "complexityLevel": "intermediate",
    "preferredExamples": ["practical", "case-studies"],
    "focusAreas": ["software", "practice"],
    "enabledFeatures": {
      "adaptiveDifficulty": true,
      "customExamples": true,
      "terminologyAdjustment": false
    },
    "updatedAt": "2025-12-20T10:00:00Z"
  }
}
```

**Response (400 Bad Request)**:
```json
{
  "success": false,
  "error": "Invalid preference data",
  "details": {
    "complexityLevel": "Must be one of: beginner, intermediate, advanced, expert"
  }
}
```

**Response (401 Unauthorized)**:
```json
{
  "success": false,
  "error": "Authentication required"
}
```

