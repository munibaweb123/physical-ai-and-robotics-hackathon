services:
  # Python FastAPI Backend
  - type: web
    name: physical-ai-backend
    runtime: python
    plan: free
    region: oregon
    branch: 002-expand-course-content
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: AUTH_SERVER_URL
        value: https://physical-ai-and-robotics-hackathon.onrender.com
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PORT
        value: "8000"
