name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - 002-expand-course-content  # Deploy from main branch
      - fix/002-expand-course-content  # Also deploy from fix branch
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: physical-ai-docs/package-lock.json

      - name: Install dependencies
        working-directory: ./physical-ai-docs
        run: npm ci

      - name: Build Docusaurus site
        working-directory: ./physical-ai-docs
        env:
          DOCUSAURUS_BETTER_AUTH_URL: https://physical-ai-and-robotics-hackathon.onrender.com
          NEXT_PUBLIC_API_URL: https://physicalai-backend.hf.space/api
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./physical-ai-docs/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
